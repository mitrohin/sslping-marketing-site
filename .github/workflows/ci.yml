name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sslping-marketing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - name: Build and verify all regions, SEO, and catalog assets
        env:
          VITE_DASHBOARD_URL: https://dashboard.sslping.io
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          npm audit --audit-level=high
      - name: Build production image
        run: docker build --pull --build-arg VITE_DASHBOARD_URL=https://dashboard.sslping.io --tag sslping-marketing:ci .
