server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    location = /health/live {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}

server {
    listen 8080;
    server_name
        sslping.io
        ae.sslping.io ar.sslping.io at.sslping.io au.sslping.io be.sslping.io bh.sslping.io
        ca.sslping.io ch.sslping.io cl.sslping.io co.sslping.io cz.sslping.io de.sslping.io dk.sslping.io
        ec.sslping.io es.sslping.io fi.sslping.io fr.sslping.io gb.sslping.io gr.sslping.io gt.sslping.io
        hk.sslping.io hr.sslping.io hu.sslping.io id.sslping.io ie.sslping.io il.sslping.io in.sslping.io
        it.sslping.io jp.sslping.io ke.sslping.io ma.sslping.io mx.sslping.io my.sslping.io ng.sslping.io
        nl.sslping.io no.sslping.io nz.sslping.io pe.sslping.io ph.sslping.io pk.sslping.io pl.sslping.io
        pr.sslping.io pt.sslping.io py.sslping.io ro.sslping.io rs.sslping.io se.sslping.io sg.sslping.io
        si.sslping.io sk.sslping.io tr.sslping.io tw.sslping.io ua.sslping.io uy.sslping.io za.sslping.io;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /health/live {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = / {
        try_files $catalog_index =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Content-Language $catalog_language always;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location = /robots.txt {
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Content-Language $catalog_language always;
        add_header Cache-Control "public, max-age=3600" always;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://$host/sitemap.xml\n";
    }

    location = /sitemap.xml {
        try_files /sitemaps/$catalog_code.xml =404;
        default_type application/xml;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.svg {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /directory-card.svg {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /site.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ^~ /regions/ { internal; }
    location ^~ /sitemaps/ { internal; }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}

server {
    listen 8080;
    server_name www.sslping.io;
    server_tokens off;

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 301 https://sslping.io$request_uri;
    }
}

server {
    listen 8080;
    server_name us.sslping.io;
    server_tokens off;

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 301 https://sslping.io$request_uri;
    }
}
