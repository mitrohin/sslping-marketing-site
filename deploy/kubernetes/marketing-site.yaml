apiVersion: apps/v1
kind: Deployment
metadata:
  name: sslping-marketing-site
  namespace: sslping
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sslping-marketing-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sslping-marketing-site
        app.kubernetes.io/part-of: sslping
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sslping-marketing-site
      containers:
        - name: marketing-site
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sslping-marketing-site
  namespace: sslping
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sslping-marketing-site
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sslping-marketing-site-ingress
  namespace: sslping
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sslping-marketing-site
  ingress:
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sslping-marketing-site
  namespace: sslping
spec:
  selector:
    app.kubernetes.io/name: sslping-marketing-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sslping-marketing-site
  namespace: sslping
spec:
  parentRefs:
    - name: sslping-public
      sectionName: marketing
  hostnames: [sslping.io]
  rules:
    - backendRefs:
        - name: sslping-marketing-site
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sslping-marketing-www-redirect
  namespace: sslping
spec:
  parentRefs:
    - name: sslping-public
      sectionName: www
  hostnames: [www.sslping.io]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: sslping.io
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sslping-marketing-regional
  namespace: sslping
spec:
  parentRefs:
    - name: sslping-public
      sectionName: regional
  hostnames: ["*.sslping.io"]
  rules:
    - backendRefs:
        - name: sslping-marketing-site
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sslping-marketing-regional-http-redirect
  namespace: sslping
spec:
  parentRefs:
    - name: sslping-public
      sectionName: http
  hostnames: ["*.sslping.io"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
