<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SSLPing public status directory</title>
  <desc id="desc">A mint service directory card with SSLPing branding, search, and public status page signals.</desc>
  <defs>
    <linearGradient id="hero" x1="80" y1="40" x2="1110" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BE8AA"/>
      <stop offset=".52" stop-color="#64DD8D"/>
      <stop offset="1" stop-color="#B7EFCA"/>
    </linearGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(1040 96) rotate(130) scale(420 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9BFFF" stop-opacity=".82"/>
      <stop offset="1" stop-color="#C9BFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#202428" stroke-opacity=".065"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1D3D29" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="#F3F5F7"/>
  <rect x="22" y="22" width="1156" height="586" rx="36" fill="url(#hero)"/>
  <rect x="22" y="22" width="1156" height="586" rx="36" fill="url(#violet)"/>
  <rect x="22" y="22" width="1156" height="586" rx="36" fill="url(#grid)"/>
  <circle cx="1115" cy="325" r="150" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".35"/>

  <g transform="translate(65 52)" filter="url(#shadow)">
    <rect width="1070" height="72" rx="18" fill="#fff" fill-opacity=".96"/>
    <rect x="14" y="13" width="46" height="46" rx="13" fill="#64DD8D"/>
    <path d="M22 37h8l4-10 7 19 5-12h7" fill="none" stroke="#202428" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="46" fill="#202428" font-family="Arial, sans-serif" font-size="24" font-weight="700">SSL<tspan fill="#168B51">Ping</tspan></text>
    <text x="746" y="43" fill="#69737A" font-family="Arial, sans-serif" font-size="16">Public service directory</text>
    <rect x="928" y="11" width="130" height="50" rx="13" fill="#202428"/>
    <text x="993" y="42" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Monitor a service</text>
  </g>

  <g text-anchor="middle" font-family="Arial, sans-serif">
    <rect x="455" y="164" width="290" height="36" rx="18" fill="#fff" fill-opacity=".55"/>
    <circle cx="478" cy="182" r="5" fill="#202428"/>
    <text x="610" y="188" fill="#202428" font-size="13" font-weight="700" letter-spacing="1.3">PUBLIC STATUS DIRECTORY</text>
    <text x="600" y="273" fill="#202428" font-size="58" font-weight="700" letter-spacing="-2.2">Find the service. Open its status.</text>
    <text x="600" y="313" fill="#465049" font-size="20">Public monitoring pages organized by region</text>
  </g>

  <g transform="translate(165 344)" filter="url(#shadow)">
    <rect width="870" height="82" rx="22" fill="#fff"/>
    <circle cx="42" cy="41" r="11" fill="none" stroke="#778189" stroke-width="2.2"/>
    <path d="m50 49 8 8" stroke="#778189" stroke-width="2.2" stroke-linecap="round"/>
    <text x="76" y="49" fill="#9AA2A9" font-family="Arial, sans-serif" font-size="19">Search for a website, app, or service…</text>
    <rect x="702" y="10" width="158" height="62" rx="16" fill="#202428"/>
    <text x="781" y="48" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Search  →</text>
  </g>

  <g transform="translate(280 456)" font-family="Arial, sans-serif">
    <g>
      <rect width="190" height="92" rx="20" fill="#fff" fill-opacity=".54" stroke="#fff" stroke-opacity=".65"/>
      <text x="22" y="42" fill="#202428" font-size="29" font-weight="700">15,576</text>
      <text x="22" y="66" fill="#536058" font-size="11" font-weight="700" letter-spacing="1">STATUS PAGES</text>
    </g>
    <g transform="translate(205)">
      <rect width="190" height="92" rx="20" fill="#fff" fill-opacity=".54" stroke="#fff" stroke-opacity=".65"/>
      <text x="22" y="42" fill="#202428" font-size="29" font-weight="700">55</text>
      <text x="22" y="66" fill="#536058" font-size="11" font-weight="700" letter-spacing="1">REGIONS</text>
    </g>
    <g transform="translate(410)">
      <rect width="230" height="92" rx="20" fill="#fff" fill-opacity=".54" stroke="#fff" stroke-opacity=".65"/>
      <text x="22" y="42" fill="#202428" font-size="29" font-weight="700">4 × GEO</text>
      <text x="22" y="66" fill="#536058" font-size="11" font-weight="700" letter-spacing="1">DISTRIBUTED CHECKS</text>
    </g>
  </g>
</svg>
